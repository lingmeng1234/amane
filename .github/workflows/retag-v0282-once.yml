name: Retag v0.28.2 after PR #3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retag-v0282-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  retag-and-rebuild:
    # Run only for the follow-up maintenance commit after the verified PR #3 merge.
    if: github.event.before == 'dbc03e37931bec9eba2b0780fb1077b4d22d70ff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move v0.28.2 tag to the verified PR #3 merge commit
        run: |
          git tag -f v0.28.2 dbc140d7d58da01a261b47f16ad219168fb861ba
          git push --force origin refs/tags/v0.28.2

      - name: Rebuild all v0.28.2 release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cli-release.yaml --ref main -f tag=v0.28.2
          gh workflow run windows-app.yml --ref v0.28.2
          gh workflow run macos-app.yml --ref v0.28.2
          gh workflow run docker.yml --ref v0.28.2
