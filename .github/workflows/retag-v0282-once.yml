name: Retag v0.28.2 after PR #4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retag-v0282-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  retag-and-rebuild:
    # Run only for the follow-up maintenance commit after the verified PR #4 merge.
    if: github.event.before == '7313bccd07445732edca1a9e59e28a10de34965c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move v0.28.2 tag to the verified PR #4 merge commit
        run: |
          git tag -f v0.28.2 7313bccd07445732edca1a9e59e28a10de34965c
          git push --force origin refs/tags/v0.28.2

      - name: Rebuild all v0.28.2 release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cli-release.yaml --ref main -f tag=v0.28.2
          gh workflow run windows-app.yml --ref v0.28.2
          gh workflow run macos-app.yml --ref v0.28.2
          gh workflow run docker.yml --ref v0.28.2
