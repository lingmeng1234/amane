name: Retag v0.28.2 after PR #4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retag-v0282-once.yml"

permissions:
  contents: write
  actions: write
  workflows: write

jobs:
  retag-and-rebuild:
    # Run only for the follow-up maintenance commit after the verified PR #4 merge.
    if: github.event.before == 'a124ac02f4591b529eb8a1feeb84adf4ea6d3fcb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move v0.28.2 tag to the verified PR #4 merge commit
        run: |
          git tag -f v0.28.2 eed44199181642a2d76324f310ef967d262c3a4b
          git push --force origin refs/tags/v0.28.2

      - name: Rebuild all v0.28.2 release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cli-release.yaml --ref main -f tag=v0.28.2
