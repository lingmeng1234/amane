name: Regenerate OpenAPI client (temporary)

on:
  push:
    branches:
      - feat/v0.28.4-face-aware-poster-crop

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Regenerate OpenAPI and client
        run: |
          uv lock
          uv sync --all-groups
          uv run python scripts/export_openapi.py
          cd web
          pnpm install --frozen-lockfile
          pnpm gen-client
      - name: Commit generated files
        run: |
          if git diff --quiet -- uv.lock web/openapi.json web/src/client; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock web/openapi.json web/src/client
          git commit -m "chore: regenerate OpenAPI client and lockfile"
          git push
